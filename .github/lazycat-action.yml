version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: code-server

build:
  toolchains: []
  run_buildscript: false

images:
  - id: code-server
    target: service
    service: code-server
    source: ghcr.io/coder/code-server
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    max_tags: 50000
    max_matching_tags: 50000
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: code-server
    summary: 浏览器里的完整 VS Code
