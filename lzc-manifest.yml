application:
  subdomain: code-server
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://code-server:8080/
services:
  code-server:
    # upstream: ghcr.io/coder/code-server:4.143.1
    image: ghcr.1ms.run/coder/code-server:4.143.1
    environment:
      - DOCKER_USER=coder
      - PASSWORD={{ .U.login_password }}
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    binds:
      - /lzcapp/var/home:/home/coder
usage: |
  code-server 是浏览器里的完整 VS Code：打开网页即可在微服上写代码，
  插件、终端、调试一应俱全，工作区文件在应用数据目录 home 下。
  登录密码为部署时自动生成的凭据（登录页会自动填充），可在部署参数里修改。
